<div class="html!"></div><!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบยืมหนังสือ - ห้องสมุดโรงเรียน</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>📚 ระบบยืมหนังสือ </h1>
        
        <div class="grid">
            <div class="card main-card">
                <h3>บันทึกข้อมูลการยืม</h3>
                <div class="input-form">
                    <input type="text" id="bookName" placeholder="ชื่อหนังสือ">
                    <input type="text" id="userName" placeholder="ชื่อ-นามสกุล ผู้ยืม">
                    <div class="row">
                        <input type="text" id="userClass" placeholder="ระดับชั้น ">
                        <input type="number" id="userNo" placeholder="เลขที่">
                    </div>
                    <button onclick="addBorrow()">ยืนยันการยืม </button>
                </div>
            </div>
        </div>

        <div id="borrowList" class="grid">
            </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
